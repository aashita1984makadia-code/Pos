<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">

  <title>Student Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }

    h1 {
      text-align: center;
      color: #166534;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #15803d;
      color: white;
    }

    .stop {
      background: #b91c1c;
      color: white;
    }

    .submit {
      background: #1d4ed8;
      color: white;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 17px;
    }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f1f5f9;
      white-space: pre-line;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .note {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>Student Attendance</h1>
  <p class="subtitle">Barcode and QR Scanner</p>

  <div id="reader"></div>

  <button class="start" id="startBtn" type="button">
    Start Camera Scanner
  </button>

  <button class="stop" id="stopBtn" type="button">
    Stop Camera
  </button>

  <hr>

  <h3>Enter Barcode Manually</h3>

  <form id="barcodeForm">
    <input
      id="barcodeInput"
      type="text"
      autocomplete="off"
      placeholder="Enter student barcode"
      required
    >

    <button class="submit" type="submit">
      Submit Attendance
    </button>
  </form>

  <div id="result" role="status" aria-live="polite">
    Ready. Start the camera or enter a barcode.
  </div>

  <p class="note">
    Camera scanning requires HTTPS and camera permission.
    Check your Google Sheet after each scan.
  </p>
</main>

<script>
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxRnWXtxmtXWbs-_30sO9089VfF9aki49uTjCkcWwoo_2xrMDNCXggMKqIKGviprybqXA/exec";

const resultBox = document.getElementById("result");
const barcodeInput = document.getElementById("barcodeInput");

let scanner = null;
let scanning = false;
let requestInProgress = false;
let lastBarcode = "";
let lastScanTime = 0;

function showMessage(message, type = "") {
  resultBox.className = type;
  resultBox.textContent = message;
}

function sendBarcode(barcode) {
  return new Promise((resolve, reject) => {
    const callback =
      "attendanceCallback_" +
      Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");
    let finished = false;

    const timeout = setTimeout(() => {
      finish(new Error(
        "No response from Apps Script. Check deployment access and URL."
      ));
    }, 20000);

    function finish(error, data) {
      if (finished) return;
      finished = true;

      clearTimeout(timeout);
      delete window[callback];
      script.remove();

      if (error) {
        reject(error);
      } else {
        resolve(data);
      }
    }

    window[callback] = function(data) {
      finish(null, data);
    };

    script.onerror = function() {
      finish(new Error(
        "Could not load Apps Script. Check deployment permissions."
      ));
    };

    const url = new URL(SCRIPT_URL);
    url.searchParams.set("action", "scan");
    url.searchParams.set("barcode", barcode);
    url.searchParams.set("callback", callback);

    script.src = url.toString();
    document.body.appendChild(script);
  });
}

async function submitBarcode(rawBarcode) {
  const barcode = String(rawBarcode || "").trim();

  if (!barcode) {
    showMessage("Enter a barcode first.", "error");
    return;
  }

  if (requestInProgress) return;

  const now = Date.now();

  if (
    barcode === lastBarcode &&
    now - lastScanTime < 2500
  ) {
    return;
  }

  lastBarcode = barcode;
  lastScanTime = now;
  requestInProgress = true;

  showMessage("Submitting barcode: " + barcode + " ...");

  try {
    const data = await sendBarcode(barcode);

    if (!data || !data.success) {
      throw new Error(
        data && data.message
          ? data.message
          : "Attendance was not confirmed."
      );
    }

    if (data.recognized) {
      showMessage(
        "✓ SCAN RECORDED\n" +
        "Student: " + data.studentName + "\n" +
        "Barcode: " + data.barcode + "\n" +
        "Status: " + data.attendance,
        "success"
      );

      barcodeInput.value = "";
    } else {
      showMessage(
        "Unknown barcode: " + data.barcode +
        "\nBarcode not found in the Attendance sheet.",
        "error"
      );
    }

  } catch (error) {
    showMessage(
      "Could not confirm attendance was saved.\n" +
      (error.message || error),
      "error"
    );

  } finally {
    requestInProgress = false;
  }
}

document.getElementById("barcodeForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();
    submitBarcode(barcodeInput.value);
  });

async function startScanner() {
  if (scanning) return;

  if (typeof Html5Qrcode === "undefined") {
    showMessage(
      "Scanner library failed to load. Check your internet connection.",
      "error"
    );
    return;
  }

  scanner = new Html5Qrcode("reader");

  try {
    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("No camera found.");
    }

    const camera =
      cameras.find(c => /back|rear|environment/i.test(c.label)) ||
      cameras[cameras.length - 1];

    await scanner.start(
      camera.id,
      {
        fps: 10,
        qrbox: { width: 260, height: 160 }
      },
      function(decodedText) {
        if (!requestInProgress) {
          submitBarcode(decodedText);
        }
      },
      function() {
        // Ignore frames without a detected barcode.
      }
    );

    scanning = true;
    showMessage("Camera started. Point it at a barcode.");

  } catch (error) {
    scanner = null;

    showMessage(
      "Could not start camera: " +
      (error.message || error) +
      "\nAllow camera permission and use HTTPS.",
      "error"
    );
  }
}

async function stopScanner() {
  if (!scanner || !scanning) return;

  try {
    await scanner.stop();
    await scanner.clear();
  } catch (error) {
    console.log(error);
  }

  scanner = null;
  scanning = false;
  showMessage("Camera stopped.");
}

document.getElementById("startBtn")
  .addEventListener("click", startScanner);

document.getElementById("stopBtn")
  .addEventListener("click", stopScanner);
</script>
</body>
</html>
