<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Barcode Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      max-width: 520px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      background: #155eef;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #475569;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #f1f5f9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>Student Attendance</h1>

  <p class="hint">
    Start the camera and scan a student barcode, or enter the barcode
    manually. Keep this page open while scanning.
  </p>

  <div id="reader"></div>

  <button id="startButton" onclick="startScanner()">
    Start Camera Scanner
  </button>

  <button class="stop" onclick="stopScanner()">
    Stop Camera
  </button>

  <form id="manualForm">
    <input
      id="barcodeInput"
      type="text"
      placeholder="Enter barcode ID"
      autocomplete="off"
      required
    >
    <button type="submit">Submit Barcode</button>
  </form>

  <div id="status" role="status" aria-live="polite">
    Ready to scan.
  </div>
</main>

<script>
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxRnWXtxmtXWbs-_30sO9089VfF9aki49uTjCkcWwoo_2xrMDNCXggMKqIKGviprybqXA/exec";

  let scanner = null;
  let scannerRunning = false;
  let requestPending = false;
  let lastBarcode = "";
  let lastScanTime = 0;
  let callbackCounter = 0;

  const statusBox = document.getElementById("status");
  const barcodeInput = document.getElementById("barcodeInput");

  function showStatus(message) {
    statusBox.textContent = message;
  }

  function startScanner() {
    if (scannerRunning) return;

    if (typeof Html5Qrcode === "undefined") {
      showStatus("Scanner library failed to load. Check your internet connection.");
      return;
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 150 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      function (decodedText) {
        submitBarcode(decodedText);
      },
      function () {}
    ).then(function () {
      scannerRunning = true;
      showStatus("Camera started. Scan a barcode.");
    }).catch(function (error) {
      showStatus("Could not start camera: " + error);
    });
  }

  function stopScanner() {
    if (!scanner || !scannerRunning) return;

    scanner.stop().then(function () {
      scannerRunning = false;
      showStatus("Camera stopped.");
    }).catch(function (error) {
      showStatus("Could not stop camera: " + error);
    });
  }

  document.getElementById("manualForm").addEventListener(
    "submit",
    function (event) {
      event.preventDefault();
      submitBarcode(barcodeInput.value);
    }
  );

  function submitBarcode(rawBarcode) {
    const barcode = String(rawBarcode || "").trim();

    if (!barcode) {
      showStatus("Enter or scan a barcode first.");
      return;
    }

    if (requestPending) {
      showStatus("A scan is already being saved. Please wait.");
      return;
    }

    const now = Date.now();

    if (barcode === lastBarcode && now - lastScanTime < 2500) {
      return;
    }

    lastBarcode = barcode;
    lastScanTime = now;
    requestPending = true;

    showStatus("Saving attendance for barcode: " + barcode);

    const callbackName =
      "attendanceCallback_" + Date.now() + "_" + (++callbackCounter);

    const script = document.createElement("script");
    const timeout = setTimeout(function () {
      cleanup();
      showStatus(
        "Request timed out. Check the Apps Script deployment URL, access settings, and internet connection."
      );
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      requestPending = false;
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function (data) {
      cleanup();

      if (!data || !data.success) {
        showStatus(
          "Attendance was not saved: " +
          (data && data.message ? data.message : "Unknown backend error.")
        );
        return;
      }

      if (data.recognized) {
        showStatus(
          "Attendance saved successfully!\n" +
          "Student: " + data.studentName + "\n" +
          "Barcode: " + data.barcode + "\n" +
          "Attendance: Present"
        );
      } else {
        showStatus(
          "Unknown barcode. It was logged, but attendance was not marked.\n" +
          "Barcode: " + data.barcode
        );
      }

      barcodeInput.value = "";
    };

    script.onerror = function () {
      cleanup();
      showStatus(
        "Could not contact Apps Script. Check the deployed /exec URL and web app access settings."
      );
    };

    const url = new URL(SCRIPT_URL);
    url.searchParams.set("action", "scan");
    url.searchParams.set("barcode", barcode);
    url.searchParams.set("callback", callbackName);
    url.searchParams.set("_", String(Date.now()));

    script.src = url.toString();
    document.body.appendChild(script);
  }
</script>
</body>
</html>
