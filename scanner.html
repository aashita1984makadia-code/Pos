<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Student Attendance Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
main{max-width:520px;margin:auto;background:white;padding:16px;border-radius:14px}
h1{text-align:center;font-size:23px}
button,input{width:100%;padding:13px;margin-top:10px;font-size:16px;border-radius:9px}
button{border:0;background:#155eef;color:white;font-weight:bold}
.stop{background:#475569}
#reader{width:100%;margin:12px auto}
#status{padding:13px;background:#edf2f7;border-radius:9px;margin-top:14px;overflow-wrap:anywhere;white-space:pre-wrap}
#status.good{background:#dcfce7;color:#166534}
#status.bad{background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<main>
<h1>Fast Attendance Scanner</h1>

<div id="reader"></div>

<button id="startBtn" onclick="startScanner()">Start Scanner</button>
<button class="stop" onclick="stopScanner()">Stop Scanner</button>

<form id="manualForm">
<input id="barcodeInput" placeholder="Enter barcode manually" autocomplete="off" required>
<button type="submit">Submit Barcode</button>
</form>

<div id="status" role="status" aria-live="polite">Ready to scan.</div>
<p class="small">Keep this page open during attendance. Camera access requires HTTPS.</p>
</main>

<script>
"use strict";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxRnWXtxmtXWbs-_30sO9089VfF9aki49uTjCkcWwoo_2xrMDNCXggMKqIKGviprybqXA/exec";

const statusBox = document.getElementById("status");
const barcodeInput = document.getElementById("barcodeInput");

let scanner = null;
let running = false;
let pending = false;
let lastBarcode = "";
let lastTime = 0;
let callbackCounter = 0;

function status(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

async function startScanner() {
  if (running) return;

  if (typeof Html5Qrcode === "undefined") {
    status("Scanner library failed to load. Check your internet connection.", "bad");
    return;
  }

  try {
    scanner = new Html5Qrcode("reader", {
      verbose: false
    });

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 20,
        qrbox: function(width, height) {
          return {
            width: Math.min(280, Math.floor(width * 0.85)),
            height: Math.min(120, Math.floor(height * 0.35))
          };
        },
        aspectRatio: 1.777,
        disableFlip: true,
        rememberLastUsedCamera: true,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      decoded => submitBarcode(decoded),
      () => {}
    );

    running = true;
    status("Camera ready. Scan the next student barcode.");
  } catch (err) {
    status("Could not start camera: " + err, "bad");
  }
}

async function stopScanner() {
  if (!scanner || !running) return;

  try {
    await scanner.stop();
    running = false;
    status("Scanner stopped.");
  } catch (err) {
    status("Could not stop scanner: " + err, "bad");
  }
}

document.getElementById("manualForm").addEventListener("submit", event => {
  event.preventDefault();
  submitBarcode(barcodeInput.value);
});

function submitBarcode(value) {
  const barcode = String(value || "").trim();
  if (!barcode) return;

  const now = Date.now();

  // Ignore duplicate camera detections for a short period.
  if (barcode === lastBarcode && now - lastTime < 1800) return;

  // Only one attendance write at a time.
  if (pending) return;

  lastBarcode = barcode;
  lastTime = now;
  pending = true;

  status("Saving: " + barcode);

  const callback = "att_cb_" + Date.now() + "_" + (++callbackCounter);
  const script = document.createElement("script");
  let finished = false;

  const timeoutId = setTimeout(() => {
    finish();
    status("Timed out. Check Apps Script deployment and internet connection.", "bad");
  }, 15000);

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(timeoutId);
    pending = false;
    script.remove();
    delete window[callback];
  }

  window[callback] = data => {
    finish();

    if (!data || !data.success) {
      status("Save failed: " + (data?.message || "Invalid backend response"), "bad");
      return;
    }

    if (data.recognized) {
      status(
        "✓ PRESENT\n" +
        data.studentName + "\n" +
        "Barcode: " + data.barcode,
        "good"
      );
    } else {
      status("UNKNOWN BARCODE\n" + data.barcode + "\nScan logged as No.", "bad");
    }

    barcodeInput.value = "";
  };

  script.onerror = () => {
    finish();
    status("Could not contact Apps Script. Check the /exec URL and access settings.", "bad");
  };

  const url = new URL(SCRIPT_URL);
  url.searchParams.set("action", "scan");
  url.searchParams.set("barcode", barcode);
  url.searchParams.set("callback", callback);
  url.searchParams.set("_", String(Date.now()));

  script.src = url.toString();
  document.body.appendChild(script);
}
</script>
</body>
</html>
