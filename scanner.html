<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Student Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
main{max-width:520px;margin:auto;background:white;padding:16px;border-radius:14px}
h1{text-align:center;font-size:23px}
#reader{width:100%;margin:12px auto}
button,input{width:100%;padding:13px;margin-top:10px;font-size:16px;border-radius:9px}
button{border:0;background:#155eef;color:white;font-weight:bold}
.stop{background:#475569}
#status{padding:13px;background:#edf2f7;border-radius:9px;margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.good{background:#dcfce7!important;color:#166534}
.bad{background:#fee2e2!important;color:#991b1b}
</style>
</head>
<body>
<main>
<h1>Fast Attendance Scanner</h1>
<div id="reader"></div>
<button onclick="startScanner()">Start Camera</button>
<button class="stop" onclick="stopScanner()">Stop Camera</button>

<form id="manualForm">
<input id="barcodeInput" placeholder="Enter barcode manually" autocomplete="off" required>
<button type="submit">Submit Barcode</button>
</form>

<div id="status" role="status" aria-live="polite">Ready to scan.</div>
</main>

<script>
"use strict";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxRnWXtxmtXWbs-_30sO9089VfF9aki49uTjCkcWwoo_2xrMDNCXggMKqIKGviprybqXA/exec";

const statusBox = document.getElementById("status");
const barcodeInput = document.getElementById("barcodeInput");

let scanner;
let running = false;
let lastBarcode = "";
let lastTime = 0;
let callbackCounter = 0;
const recentlyScanned = new Map();

function showStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

async function startScanner() {
  if (running) return;

  if (typeof Html5Qrcode === "undefined") {
    showStatus("Scanner library failed to load. Check internet.", "bad");
    return;
  }

  try {
    scanner = new Html5Qrcode("reader", { verbose: false });

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 25,
        qrbox: (width, height) => ({
          width: Math.min(320, Math.floor(width * 0.9)),
          height: Math.min(140, Math.floor(height * 0.4))
        }),
        disableFlip: true,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      },
      barcode => submitBarcode(barcode),
      () => {}
    );

    running = true;
    showStatus("Camera ready. Scan the next barcode.");
  } catch (error) {
    showStatus("Camera error: " + error, "bad");
  }
}

async function stopScanner() {
  if (!scanner || !running) return;

  try {
    await scanner.stop();
    running = false;
    showStatus("Camera stopped.");
  } catch (error) {
    showStatus("Stop error: " + error, "bad");
  }
}

document.getElementById("manualForm").addEventListener("submit", event => {
  event.preventDefault();
  submitBarcode(barcodeInput.value);
});

function submitBarcode(raw) {
  const barcode = String(raw || "").trim();
  if (!barcode) return;

  const now = Date.now();

  // Suppress repeat camera detections of the same barcode.
  if (barcode === lastBarcode && now - lastTime < 1200) return;

  // Suppress repeated scans of a student during the same session.
  if (recentlyScanned.has(barcode)) {
    lastBarcode = barcode;
    lastTime = now;
    showStatus("Already scanned: " + barcode);
    return;
  }

  lastBarcode = barcode;
  lastTime = now;
  recentlyScanned.set(barcode, now);

  // Show immediate feedback without waiting for the server.
  showStatus("Barcode detected: " + barcode + "\nSaving attendance…");

  sendToServer(barcode);
}

function sendToServer(barcode) {
  const callback = "attendance_cb_" + Date.now() + "_" + (++callbackCounter);
  const script = document.createElement("script");
  let finished = false;

  const timeoutId = setTimeout(() => {
    finish();
    recentlyScanned.delete(barcode);
    showStatus("Save timed out. Please retry barcode: " + barcode, "bad");
  }, 15000);

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(timeoutId);
    script.remove();
    delete window[callback];
  }

  window[callback] = data => {
    finish();

    if (!data || !data.success) {
      recentlyScanned.delete(barcode);
      showStatus("Save failed: " + (data?.message || "No valid response"), "bad");
      return;
    }

    if (data.recognized) {
      showStatus(
        "✓ PRESENT\n" + data.studentName + "\nBarcode: " + data.barcode,
        "good"
      );
    } else {
      recentlyScanned.delete(barcode);
      showStatus("UNKNOWN BARCODE\n" + data.barcode, "bad");
    }

    barcodeInput.value = "";
  };

  script.onerror = () => {
    finish();
    recentlyScanned.delete(barcode);
    showStatus("Cannot contact Apps Script. Check internet and deployment URL.", "bad");
  };

  const url = new URL(SCRIPT_URL);
  url.searchParams.set("action", "scan");
  url.searchParams.set("barcode", barcode);
  url.searchParams.set("callback", callback);
  url.searchParams.set("_", String(Date.now()));

  script.src = url.toString();
  document.body.appendChild(script);
}
</script>
</body>
</html>
