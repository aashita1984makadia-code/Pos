<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>SmartMart Student Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      text-align: center;
      color: #166534;
      font-size: 25px;
      margin-top: 4px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #15803d;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    .submit {
      background: #1d4ed8;
      color: white;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 17px;
      margin: 8px 0;
    }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f1f5f9;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .note {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 16px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>SmartMart Attendance</h1>
    <p class="subtitle">Student Barcode & QR Scanner</p>

    <div id="reader"></div>

    <button class="start" id="startBtn" type="button">
      📷 Start Camera Scanner
    </button>

    <button class="stop" id="stopBtn" type="button">
      Stop Camera
    </button>

    <hr>

    <h3>Enter Barcode Manually</h3>

    <form id="barcodeForm">
      <input
        id="barcodeInput"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter or scan barcode"
        required
      >
      <button class="submit" type="submit">
        Submit Attendance
      </button>
    </form>

    <div id="result" role="status" aria-live="polite">
      Ready. Start the camera or enter a barcode.
    </div>

    <p class="note">
      Camera scanning requires HTTPS and browser camera permission.
      A successful response means the backend recorded the scan;
      verify the spreadsheet if attendance is important.
    </p>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxRnWXtxmtXWbs-_30sO9089VfF9aki49uTjCkcWwoo_2xrMDNCXggMKqIKGviprybqXA/exec";

    const resultBox = document.getElementById("result");
    const barcodeInput = document.getElementById("barcodeInput");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let scanner = null;
    let scanning = false;
    let requestInProgress = false;
    let lastBarcode = "";
    let lastScanTime = 0;

    function showMessage(message, type = "") {
      resultBox.className = type;
      resultBox.textContent = message;
    }

    function submitBarcode(barcode) {
      barcode = String(barcode || "").trim();

      if (!barcode) {
        showMessage("Please enter a barcode.", "error");
        return;
      }

      if (requestInProgress) {
        showMessage("Please wait for the previous scan to finish.");
        return;
      }

      const now = Date.now();

      if (barcode === lastBarcode && now - lastScanTime < 2500) {
        return;
      }

      lastBarcode = barcode;
      lastScanTime = now;
      requestInProgress = true;

      showMessage("Submitting barcode: " + barcode + " ...");

      const callbackName =
        "attendanceCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;

      const timeout = setTimeout(() => {
        finish();
        showMessage(
          "No response from Google Apps Script. Check the deployment URL, access permissions and internet connection.",
          "error"
        );
      }, 20000);

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        requestInProgress = false;

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        script.remove();
      }

      window[callbackName] = function(data) {
        finish();

        if (!data || !data.success) {
          showMessage(
            "Error: " + (data && data.message
              ? data.message
              : "Invalid server response."),
            "error"
          );
          return;
        }

        if (data.recognized) {
          showMessage(
            "✓ ATTENDANCE SCAN RECORDED\n" +
            "Student: " + data.studentName + "\n" +
            "Barcode: " + data.barcode + "\n" +
            "Status: " + data.attendance,
            "success"
          );
          barcodeInput.value = "";
        } else {
          showMessage(
            "Unknown barcode: " + data.barcode +
            "\nThis barcode was not found in the Attendance sheet.",
            "error"
          );
        }
      };

      script.onerror = function() {
        finish();
        showMessage(
          "Could not contact the attendance server. Check the deployment and permissions.",
          "error"
        );
      };

      const url = new URL(SCRIPT_URL);
      url.searchParams.set("action", "scan");
      url.searchParams.set("barcode", barcode);
      url.searchParams.set("callback", callbackName);

      script.src = url.toString();
      document.body.appendChild(script);
    }

    document.getElementById("barcodeForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();
        submitBarcode(barcodeInput.value);
      }
    );

    async function startScanner() {
      if (scanning) return;

      if (typeof Html5Qrcode === "undefined") {
        showMessage(
          "Scanner library did not load. Check your internet connection.",
          "error"
        );
        return;
      }

      scanner = new Html5Qrcode("reader");

      try {
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No camera found on this device.");
        }

        const backCamera =
          cameras.find(camera =>
            /back|rear|environment/i.test(camera.label)
          ) || cameras[cameras.length - 1];

        await scanner.start(
          backCamera.id,
          {
            fps: 10,
            qrbox: { width: 260, height: 160 },
            aspectRatio: 1.0
          },
          function(decodedText) {
            if (!requestInProgress) {
              submitBarcode(decodedText);
            }
          },
          function() {
            // Ignore normal frames where no barcode is detected.
          }
        );

        scanning = true;
        showMessage("Camera started. Point it at a student barcode.");
      } catch (error) {
        scanner = null;
        showMessage(
          "Could not start camera: " +
          (error.message || String(error)) +
          "\nAllow camera permission and open this page using HTTPS.",
          "error"
        );
      }
    }

    async function stopScanner() {
      if (!scanner || !scanning) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        console.log(error);
      }

      scanner = null;
      scanning = false;
      showMessage("Camera stopped.");
    }

    startBtn.addEventListener("click", startScanner);
    stopBtn.addEventListener("click", stopScanner);
  </script>
</body>
</html>
